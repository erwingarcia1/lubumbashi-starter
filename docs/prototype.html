<title>Lubumbashi Tax Platform Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1EEEE; --panel:#FFFFFF; --ink:#1F1B1C; --ink-2:#5C5456; --ink-3:#8E8688; --rule:#DCD5D6; --rule-2:#ECE7E7;
  --red:#C1121F; --red-deep:#8B0F1A; --red-soft:#F9E3E5;
  --ok:#1E7F4F; --ok-soft:#DDF2E6; --warn:#B7791F; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#F9DEDC;
  --chip:#F4F1F1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171314; --panel:#211C1D; --ink:#EFE9EA; --ink-2:#B9B0B2; --ink-3:#847B7D; --rule:#3B3335; --rule-2:#2C2627; --chip:#2A2425;
  }
}
:root[data-theme="dark"]{
  --bg:#171314; --panel:#211C1D; --ink:#EFE9EA; --ink-2:#B9B0B2; --ink-3:#847B7D; --rule:#3B3335; --rule-2:#2C2627; --chip:#2A2425;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;padding-block:0 40px;padding-inline:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.top h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.top .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);background:var(--red-soft);padding:3px 8px;border-radius:3px}
.top .hint{color:var(--ink-3);font-size:12.5px;margin-left:auto}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:8px}
.tabs button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:600;font-size:13px;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:focus-visible,.rail button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 270px;gap:20px;align-items:start}
.layout.wide{grid-template-columns:200px minmax(0,1fr)}
.layout.wide .notes{grid-column:1/-1;max-width:1000px;margin:0 auto;width:100%}
@media (max-width:1100px){.layout{grid-template-columns:200px 1fr}.notes{grid-column:1/-1}}
@media (max-width:760px){.layout{grid-template-columns:1fr}.rail{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}.rail button{white-space:nowrap}.rail .grp{display:none}}
.rail{display:flex;flex-direction:column;gap:2px}
.rail .grp{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px 10px}
.rail .grp:first-child{margin-top:0}
.rail button{text-align:left;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.rail button .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);min-width:18px}
.rail button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rail button.on .n{color:var(--red)}
.stage{display:flex;justify-content:center;align-items:flex-start;min-height:400px}
.notes{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:13px}
.notes h3{margin:0 0 6px;font-size:13px;font-weight:700}
.notes .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px}
.notes p{margin:0 0 8px;color:var(--ink-2)}
.notes ul{margin:0;padding-left:16px;color:var(--ink-2)}
.notes li{margin-bottom:5px}

/* Device frames — the product runs light-only inside the frame, painted explicitly */

.desk{width:100%;max-width:1000px;background:#2A2526;border-radius:10px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.p-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:12px}
.proto{position:absolute;right:10px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:#8E8688;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:3px;pointer-events:none}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:13px 14px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-align:center}
.btn.p{background:#C1121F;color:#fff}

.row{display:flex;gap:10px}

.muted{color:#5C5456;font-size:12.5px}
.h{font-size:16px;font-weight:700;margin:0}
.h2{font-size:13px;font-weight:700;margin:0;color:#5C5456;text-transform:uppercase;letter-spacing:.05em}
.list a,.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFEAEA;color:inherit;text-decoration:none;cursor:pointer}
.list .it:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:#F9E3E5;color:#8B0F1A;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.grow{flex:1;min-width:0}
.tabbar{display:flex;border-top:1px solid #E3DEDE;background:#fff}

.qr{width:150px;height:150px;margin:0 auto;display:grid;grid-template-columns:repeat(11,1fr);gap:1px;background:#fff;padding:6px;border:1px solid #E3DEDE;border-radius:6px}

.qr i.o{background:#fff}
.cam{background:#1B1B1F;border-radius:10px;height:280px;position:relative;display:grid;place-items:center;color:#fff}
.cam .box{width:190px;height:190px;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}

.prov{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid #E3DEDE;border-radius:10px;cursor:pointer}
.prov.on{border-color:#C1121F;box-shadow:0 0 0 2px #F9E3E5}
.prov .lg{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;flex:none}
.spin{width:44px;height:44px;border:4px solid #ECE7E7;border-top-color:#C1121F;border-radius:50%;margin:16px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.check{width:64px;height:64px;border-radius:50%;background:#1E7F4F;color:#fff;display:grid;place-items:center;font-size:34px;margin:8px auto}
.receipt{background:#fff;border:1px dashed #C9C2C2;border-radius:6px;padding:14px;font-size:13px}
.receipt .rh{text-align:center;border-bottom:1px solid #E3DEDE;padding-bottom:8px;margin-bottom:8px}
.receipt .rh b{display:block;font-size:13px}
.receipt .rh small{color:#5C5456}
.sync{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px}
.sync.off{background:#FBEFD6;color:#8A5A12}.sync.on{background:#DDF2E6;color:#1E7F4F}
.step{display:flex;gap:10px;align-items:flex-start}

.gps{background:#E8EFE9;border-radius:8px;height:120px;position:relative;overflow:hidden}
.gps .pin{position:absolute;width:14px;height:14px;background:#C1121F;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.gps .rd{position:absolute;background:#fff;height:6px}
/* desktop admin */
.side{width:210px;background:#1F1718;color:#E9E2E3;padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex:none}

.main{flex:1;padding:18px 22px;min-width:0;display:flex;flex-direction:column;gap:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid #E3DEDE;border-radius:8px;padding:12px 14px}

.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff}

.tw{overflow-x:auto;border:1px solid #E3DEDE;border-radius:8px;background:#fff}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;font-size:12.5px}
.bar .tr{background:#EFEAEA;height:10px;border-radius:2px;overflow:hidden}
.bar .fl{height:100%;background:#C1121F}
.bar .fl.g{background:#1E7F4F}
.bar .v{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.map{background:#E8EFE9;border-radius:8px;height:340px;position:relative;overflow:hidden;border:1px solid #D9E2DB}
.map .rd{position:absolute;background:#fff;height:5px;border-radius:2px}
.map .zone{position:absolute;font-size:10.5px;color:#4E5E52;font-weight:600;letter-spacing:.04em}

.map .lg span{display:flex;align-items:center;gap:6px}
.map .lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tl{display:flex;flex-direction:column;gap:0}
.tl .e{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #EFEAEA;font-size:12.5px}
.tl .e .w{font-family:"IBM Plex Mono",monospace;color:#5C5456;font-size:11.5px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.form2{grid-template-columns:1fr}}
.tog{display:inline-flex;gap:0;border:1px solid #D5CFCF;border-radius:6px;overflow:hidden}

a.lnk{color:#C1121F;cursor:pointer;text-decoration:underline}
</style>

S['d-audit'] = {g:'admin', t:'Journal d’audit', r:()=>desk('d-audit',`<div class="ttl"><h2>Journal d’audit</h2><div class="f"><span>Actions sensibles</span><span>13/09/2026</span><span>Exporter</span></div></div><div class="tw"><table class="t"><tr><th>Horodatage</th><th>Qui</th><th>Rôle</th><th>Action</th><th>Objet</th><th>Où</th><th>Appareil</th></tr>${[['13/09 09:02:14','Ngoy K.','Finances','Écart résolu · doublon remboursé','TX-2609-12-0955-8F','Bureau · 41.243.x.x','Chrome / Windows'],['13/09 08:44:07','Système','—','Paiement confirmé (callback M-Pesa)','RCP-2609-000287','—','api'],['13/09 08:43:31','AG-KAM-007','Agent','Demande de paiement envoyée','TX-2609-13-0842-7K','-11.6642, 27.4930','DEV-3F9A'],['13/09 08:12:40','AG-KAM-007','Agent','Paiement échoué (Airtel : solde insuffisant)','LUB-KAM-00000127','-11.6688, 27.4901','DEV-3F9A'],['12/09 17:48:02','Ilunga M.','Superviseur','Catégorie modifiée · Commerce → Ménage · motif : erreur de saisie','LUB-KAM-00000140','Bureau','Chrome / Android'],['12/09 15:10:55','Admin','Administrateur','Appareil révoqué · perte déclarée','DEV-9C21 · AG-KAM-011','Bureau','Chrome / Windows'],['12/09 11:30:00','Système','—','Rappels SMS envoyés · 1 251 destinataires','Campagne échéance 31/08','—','job']].map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="mono">${r[4]}</td><td class="mono">${r[5]}</td><td class="mono">${r[6]}</td></tr>`).join('')}</table></div><div class="muted">Le journal est en ajout seul : aucune ligne ne peut être modifiée ni supprimée, y compris par l’administrateur.</div>`), n:{what:'Section 6 of the plan, literally: WHO + WHAT + WHEN + WHERE + DEVICE for every sensitive action. Append-only, even for administrators. This is the screen an auditor lives in.', confirm:['Which external body audits the Mairie, and what format do they expect?']}};
S['d-reports'] = {g:'admin', t:'Rapports & exports', r:()=>desk('d-reports',`<div class="ttl"><h2>Rapports</h2></div><div class="kpis">${[['Rapport mensuel de recouvrement','Par commune, taxe, canal · PDF + Excel','Septembre 2026 (en cours)'],['État des impayés','Liste nominative avec montants et retards · Excel','1 251 lignes'],['Performance des agents','Recensements, encaissements, échecs · PDF','5 agents'],['Rapprochement du jour','Écarts et clôtures · PDF','12/09/2026'],['Journal d’audit','Export complet signé · CSV','13/09/2026'],['Liste des reçus','Tous les reçus émis avec références fournisseurs · Excel','312 reçus']].map(x=>`<div class="kpi" style="display:flex;flex-direction:column;gap:4px"><div style="font-weight:700">${x[0]}</div><div class="muted">${x[1]}</div><div class="muted mono">${x[2]}</div><button class="btn s sm" style="margin-top:6px">Générer</button></div>`).join('')}</div>`), n:{what:'The exports Finance asked for in the plan. Each one is a saved query, so adding a new report later is configuration, not code.', confirm:['Which of these does the province (Haut-Katanga) require from the Mairie, and how often?']}};

/* PORTAL */
S['p-home'] = {g:'portal', t:'Portail · mon compte', r:()=>{const t=T('LUB-KAM-00000125');return phone(`${hd('Ville de Lubumbashi','Portail du contribuable')}<div class="p-body"><div class="muted">Bonjour</div><div class="h">${t.name}</div><div class="mono muted">${t.id} · ${t.addr}</div><div class="card acc"><div class="muted">Vous devez</div><div class="big amt" style="color:#C1121F">10 000 FC</div><div class="muted">Assainissement · août (retard) + septembre</div><button class="btn p" style="margin-top:10px" onclick="go('p-pay')">Payer maintenant</button></div><div class="card" style="font-size:12.5px"><p class="h2">Détail</p><div class="kv"><span>Août 2026 · échu le 31/08</span><b class="amt" style="color:#B3261E">5 000 FC</b></div><div class="kv"><span>Septembre 2026 · échéance 30/09</span><b class="amt">5 000 FC</b></div></div><div class="card" style="font-size:12.5px"><p class="h2">Mes reçus</p><div class="list">${t.hist.map(h=>`<div class="it" onclick="go('p-verify')"><div class="grow"><div style="font-weight:600">${h.d} · ${FC(h.a)}</div><div class="muted mono">${h.r} · ${h.c}</div></div><span class="muted">Télécharger ›</span></div>`).join('')}</div></div><div class="muted" style="text-align:center">Une question ? <a class="lnk" onclick="go('p-complaint')">Signaler un problème</a></div></div>`);}, n:{what:'The taxpayer opens this from the SMS link or by scanning their own QR. No account creation, no password: the link is signed and expires. They see what they owe, why, and one button.', confirm:['Link-only access, or should there be an OTP step to protect the balance from being seen by anyone with the SMS?','Do we show the penalty explicitly, or fold it into the amount?']}};
S['p-invoice'] = {g:'portal', t:'Avis d’imposition · QR', r:()=>phone(`${hd('Avis d’imposition','Assainissement · Septembre 2026')}<div class="p-body"><div class="receipt"><div class="rh"><b>VILLE DE LUBUMBASHI</b><small>Avis d’imposition — chaque avis porte son QR</small></div><div class="kv"><span>Contribuable</span><b>Mwamba Kasongo Jean</b></div><div class="kv"><span>Identifiant</span><b class="mono">LUB-KAM-00000125</b></div><div class="kv"><span>Période</span><b>Septembre 2026</b></div><div class="kv"><span>Montant</span><b class="amt">5 000 FC</b></div><div class="kv"><span>Échéance</span><b>30/09/2026</b></div><div class="kv"><span>Référence</span><b class="mono">AV-2609-000482</b></div></div>${qr()}<div class="muted" style="text-align:center">Scannez pour vérifier l’authenticité et payer<br><span class="mono">lubumbashi.cd/f/AV-2609-000482</span></div><button class="btn p" onclick="go('p-pay')">Payer cet avis</button><button class="btn s" onclick="go('p-verify')">Vérifier l’authenticité</button></div>`), n:{what:'Every invoice — printed, PDF or SMS — carries a QR unique to that invoice. Scanning proves it really comes from the Mairie and opens exactly this amount for payment. It closes the classic fraud: fake invoices and fake collectors at the door.', confirm:['Invoice numbering and required legal wording per the arrêté (with D2/D3).','Are paper avis still distributed once the QR version exists, and by whom?','Scan lands on payment directly, or verification first with payment one tap later?']}};
S['p-pay'] = {g:'portal', t:'Portail · payer', r:()=>phone(`${hd('Payer','10 000 FC · Assainissement')}<div class="p-body"><div class="fld"><label>Montant à payer</label><div class="row"><div class="in mono" style="border-color:#C1121F">10 000 FC · tout</div><div class="in mono ph">5 000 FC · août seul</div></div></div><p class="h2">Choisir le moyen de paiement</p>${[['M-Pesa','#C1121F'],['Airtel Money','#B3261E'],['Orange Money','#B7791F']].map((p,i)=>`<div class="prov ${i===0?'on':''}"><div class="lg" style="background:${p[1]}">${p[0].slice(0,2).toUpperCase()}</div><div class="grow"><div style="font-weight:600">${p[0]}</div><div class="muted">Vous recevrez une demande sur votre téléphone</div></div></div>`).join('')}<div class="fld"><label>Votre numéro</label><div class="in mono">+243 99 412 8830</div></div><div class="card" style="font-size:12px"><div class="kv"><span>Frais de transaction</span><b>Pris en charge par la Mairie</b></div><div class="kv"><span>Reçu</span><b>Par SMS immédiatement</b></div></div><div style="margin-top:auto"><button class="btn p" onclick="go('p-done')">Payer 10 000 FC</button></div></div>`), n:{what:'Self-service payment, no agent needed. This is the screen the two-week SMS pilot is really testing: if households use this, the platform is justified.', confirm:['Who pays the mobile money fee: the taxpayer or the Mairie? It affects the 2% more than you\'d think.','Partial payment (one month) allowed?']}};
S['p-done'] = {g:'portal', t:'Portail · paiement confirmé', r:()=>phone(`${hd('Paiement confirmé','Merci')}<div class="p-body"><div style="text-align:center"><div class="check">✓</div><div class="h">Merci, Jean</div><div class="muted">Votre paiement de <b>10 000 FC</b> est confirmé par M-Pesa.</div></div><div class="receipt"><div class="rh"><b>VILLE DE LUBUMBASHI</b><small>Reçu officiel · Taxe d’assainissement</small></div><div class="kv"><span>Reçu n°</span><b class="mono">RCP-2609-000291</b></div><div class="kv"><span>Période</span><b>Août + Sept. 2026</b></div><div class="kv"><span>Montant</span><b class="amt">10 000 FC</b></div><div class="kv"><span>M-Pesa</span><b class="mono">MP260913A7Q2</b></div><div class="kv"><span>Date</span><b>13/09/2026 09:15</b></div></div>${qr()}<div class="muted" style="text-align:center">Montrez ce QR à tout agent qui vous réclame cette taxe.</div><button class="btn s" onclick="go('p-home')">Retour à mon compte</button></div>`), n:{what:'Confirmation and receipt. The last line matters in context: the receipt QR protects the household from being asked to pay twice by a different agent, which is a real fear and a real reason people avoid paying.', confirm:['Does the Mairie want its official seal on the digital receipt? That needs their authorisation; the prototype uses a placeholder.']}};
S['p-verify'] = {g:'portal', t:'Vérifier un reçu', r:()=>phone(`${hd('Vérification de reçu','lubumbashi.cd/v/…')}<div class="p-body"><div class="fld"><label>Numéro de reçu</label><div class="in mono">RCP-2609-000287</div></div><button class="btn s" onclick="go('p-verify')">Vérifier</button><div class="card" style="border-color:#1E7F4F;background:#F2FAF5"><div style="display:flex;gap:10px;align-items:center"><div class="check" style="width:40px;height:40px;font-size:22px;margin:0">✓</div><div><div class="h" style="color:#1E7F4F">Reçu authentique</div><div class="muted">Émis par la Ville de Lubumbashi</div></div></div><div style="margin-top:10px;font-size:12.5px"><div class="kv"><span>Contribuable</span><b>Mwamba K. J. · ••125</b></div><div class="kv"><span>Montant</span><b class="amt">10 000 FC</b></div><div class="kv"><span>Date</span><b>13/09/2026 08:44</b></div><div class="kv"><span>Taxe</span><b>Assainissement · août + sept.</b></div></div></div><div class="card" style="font-size:12.5px"><p class="h2">Pourquoi vérifier ?</p><p class="muted" style="margin:6px 0 0">Un reçu qui n’apparaît pas ici n’a pas été émis par la Mairie. Ne payez jamais en espèces à un agent.</p></div></div>`), n:{what:'Public, no login. Anyone — a taxpayer, a supervisor, a journalist — can check whether a receipt is real. Fake paper receipts are one of the ways money leaks today.', confirm:['Is the public verification page acceptable to the Mairie, given it exposes partial names?']}};
S['p-complaint'] = {g:'portal', t:'Signaler un problème', r:()=>phone(`${hd('Signaler un problème','Réponse sous 5 jours ouvrés')}<div class="p-body"><div class="fld"><label>Objet</label><div class="in">Montant incorrect</div></div><div class="muted">Autres : Payé mais non reconnu · Agent suspect · Adresse erronée · Les déchets ne sont pas collectés · Autre</div><div class="fld"><label>Description</label><div class="in" style="min-height:90px">Je suis une personne âgée vivant seule, je devrais être exonérée selon la liste communale.</div></div><div class="fld"><label>Votre numéro (pour la réponse)</label><div class="in mono">+243 99 412 8830</div></div><button class="btn p" onclick="go('p-home')">Envoyer</button><div class="card" style="font-size:12.5px"><p class="h2">Mes demandes</p><div class="kv"><span>02/09 · Adresse erronée</span><span class="pill ok">Résolu</span></div></div></div>`), n:{what:'The complaint channel from the plan, with one category added on purpose: "waste is not being collected". If the city wants people to pay, it has to hear when the service fails. This is where your question about impact on people lives in the product.', confirm:['Who answers complaints, and within what delay? An unanswered complaint box is worse than none.']}};

/* ---------- render ---------- */
const GROUPS = [['agent','Application agent (mobile)'],['admin','Tableau de bord Mairie (web)'],['portal','Portail contribuable (mobile)']];
function renderTabs(){document.getElementById('tabs').innerHTML=GROUPS.map(g=>`<button class="${group===g[0]?'on':''}" onclick="setGroup('${g[0]}')">${g[1]}</button>`).join('');}
function renderRail(){const ids=Object.keys(S).filter(k=>S[k].g===group);document.getElementById('rail').innerHTML=`<div class="grp">${GROUPS.find(g=>g[0]===group)[1]}</div>`+ids.map((k,i)=>`<button class="${cur===k?'on':''}" onclick="go('${k}')"><span class="n">${String(i+1).padStart(2,'0')}</span>${S[k].t}</button>`).join('');}
function renderNotes(){const s=S[cur];document.getElementById('notes').innerHTML=`<h3>${s.t}</h3><div class="k">What this screen does</div><p>${s.n.what}</p><div class="k">To confirm with Jonathan</div><ul>${s.n.confirm.map(c=>`<li>${c}</li>`).join('')}</ul>`;}
function setGroup(g){group=g;cur=Object.keys(S).find(k=>S[k].g===g);render();}
function go(id){clearTimeout(ptimer);cur=id;group=S[id].g;render();}
function render(){document.querySelector(".layout").classList.toggle("wide",group==="admin");renderTabs();renderRail();document.getElementById('stage').innerHTML=S[cur].r();renderNotes();}
render();
</script>
